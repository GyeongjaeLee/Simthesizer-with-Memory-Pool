# MiniMax-M2.7 FP8 on four H200 GPUs, vLLM 0.25.1 pure TP4, FP8 KV.
# Costs: measured forward-pass table; serving limits from the same campaign.
[system]
kind = "single_instance"

[system.model_runner]
kind = "forward_pass"
tp = 4
table = "../../data/h200/minimax_m2_7-tp4.json"

[system.scheduler]
kind = "chunked_prefill"
block_size = 16
max_batch = 1024              # observed peak of running decodes
max_num_batched_tokens = 8192
device_mem = 150754820096     # 143771 MiB
device_mem_utilization = 0.92
reserved_device_bytes = 4294967296 # assumed activation and graph workspace
enable_prefix_caching = true

[system.model]
kind = "minimax_m2"
hidden_size = 3072
intermediate_size = 1536
num_attention_heads = 48
num_hidden_layers = 62
num_key_value_heads = 8
num_local_experts = 256
num_experts_per_tok = 8
vocab_size = 200064
head_dim = 128
rotary_dim = 64
kv_dtype = "fp8"
